name: Publish Explore Content

on:
  push:
    branches: [main]
    paths:
      - "library.json"
      - "content/images/**"
      - "content/videos/**"
      - ".github/workflows/publish-content.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare public content
        run: |
          mkdir -p _site/images _site/videos
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Quincy-B/mobilephoton-explore/main/library.json \
            --output _site/library.json
          cp -R content/images/. _site/images/
          cp -R content/videos/. _site/videos/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static content
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
